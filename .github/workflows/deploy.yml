name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener código del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar el entorno Java
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Compilar el archivo .jar omitiendo pruebas
      - name: Build con Maven
        run: mvn clean package -DskipTests

      # 4. Iniciar sesión en Docker Hub de forma segura
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Construir la imagen Docker localmente
      - name: Build imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest .

      # 6. Publicar la imagen definitiva en la nube
      - name: Push imagen a Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest

      # 7. Conectarse por SSH a la EC2 y actualizar el contenedor
      - name: Deploy en EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest
            docker stop guia-service || true
            docker rm guia-service || true
            cat << EOF > java_env.list
            TNS_ADMIN="/app/src/main/resources/Wallet_MBD"
            ORACLE_NET_WALLET_LOCATION="/app/src/main/resources/Wallet_MBD"
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_EC2_METADATA_DISABLED=true
            SPRING_CLOUD_AWS_STACK_AUTO=false
            SPRING_CLOUD_AWS_REGION_AUTO=false
            AWS_S3_BUCKET_NAME="${{ secrets.AWS_S3_BUCKET }}"
            SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }}
            SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            SPRING_CLOUD_AWS_CREDENTIALS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            SPRING_CLOUD_AWS_REGION_STATIC=${{ secrets.AWS_REGION }}
            EOF
            docker run -d --name guia-service -p 8080:8080 \
            --env-file java_env.list \
            -e JAVA_TOOL_OPTIONS="-doracle.net.tns_admin=/app/src/main/resources/Wallet_MBD -doracle.net.wallet_location=/app/src/main/resources/Wallet_MBD" \
            -v /tmp:/app/efs \
            -v /home/ec2-user/Wallet_MBD:/app/src/main/resources/Wallet_MBD \
            ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest