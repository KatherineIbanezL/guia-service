name: Build and Push Docker Image
 
on: 
  push:
    branches:
      - main  

jobs: 
  build:
    runs-on: ubuntu-latest
 
    steps:
      # Paso 1: Clonar el repositorio en el entorno virtual de GitHub
      - name: Checkout repository
        uses: actions/checkout@v3
 
      # Paso 2: Autenticar en DockerHub usando tus nombres de secretos reales (Figura 1)
      - name: Log in to DockerHub
        uses: docker/login-action@v2 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      # Paso 3: Construir la imagen Docker usando tu archivo Dockerfile Multi-stage
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest .
 
      # Paso 4: Subir la imagen empaquetada a tu repositorio de DockerHub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest
          
      # Paso 5: Configurar la llave SSH privada (.pem) dentro del runner
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
 
      # Paso 6: Conectarse por SSH a Amazon Linux usando tus secretos exactos
      - name: SSH commands to deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'
            
            # 1. Autenticar la máquina virtual de AWS en DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # 2. Descargar la última versión de la imagen compilada
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest
            
            # 3. Detener y limpiar cualquier contenedor previo si existe
            sudo docker stop guia-service || true 
            sudo docker rm guia-service || true
            
            # 4. Levantar el microservicio incluyendo el volumen físico de Amazon EFS (Criterio 1 de la pauta)
            sudo docker run -d \
              --name guia-service \
              -p 8080:8080 \
              -v /mnt/efs:/app/efs \
              ${{ secrets.DOCKERHUB_USERNAME }}/guia-service:latest
              
          EOF